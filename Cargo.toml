[package]
name = "WallPull"
version = "1.0.3"
edition = "2024"
authors = ["Xiaonan"]
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/XiaonanXY/WallPull"
description = "WallPull - 绿色单文件 Wallpaper Engine 创意工坊壁纸解析与交互管理神器"
build = "build.rs"

[[bin]]
name = "WallPull"
path = "src/main.rs"

[dependencies]
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
include_dir = "0.7"
lewton = "0.10"
rayon = "1.10"
regex = "1.11"
rfd = "0.18"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "2.12", features = ["json"] }
urlencoding = "2.1"
webview2-com = "0.39.1"
windows-core = "0.62"
winreg = "0.56"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
