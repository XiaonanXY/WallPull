name: Build & Release

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install, lint, and build frontend
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Rust tests and build release executable
        shell: pwsh
        run: |
          cargo test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RUSTFLAGS = "--remap-path-prefix=$env:USERPROFILE=~ --remap-path-prefix=$env:GITHUB_WORKSPACE=. -C link-arg=/PDBALTPATH:%_PDB%"
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "target/release/WallPull.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  WallPull.exe" | Set-Content -Path "WallPull.exe.sha256" -Encoding ascii
          Get-Content "WallPull.exe.sha256"

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WallPull-windows-x64
          path: |
            target/release/WallPull.exe
            WallPull.exe.sha256

  build-ipad:
    name: Build iPadOS Unsigned IPA (15.4+)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ipad

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          ls -d /Applications/Xcode*.app
          for app in /Applications/Xcode_16.4.app /Applications/Xcode_16.3.app /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app /Applications/Xcode.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Release App (iphoneos arm64)
        run: |
          xcodebuild \
            -project WallPullIPad.xcodeproj \
            -scheme WallPullIPad \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Ad-Hoc Signed IPA & Checksum
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/WallPull.app"
          test -d "$APP_PATH"
          rm -rf Payload WallPull-iPad.ipa WallPull-iPad.ipa.sha256
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          codesign --force --sign - --timestamp=none --deep Payload/WallPull.app
          zip -qry WallPull-iPad.ipa Payload
          shasum -a 256 WallPull-iPad.ipa | awk '{print tolower($1) "  WallPull-iPad.ipa"}' > WallPull-iPad.ipa.sha256
          cat WallPull-iPad.ipa.sha256
          ls -lh WallPull-iPad.ipa

      - name: Upload iPad build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WallPull-iPad-ipa
          path: |
            ipad/WallPull-iPad.ipa
            ipad/WallPull-iPad.ipa.sha256
